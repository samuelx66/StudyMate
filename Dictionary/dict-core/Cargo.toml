description = "Cross-platform MDX/MDD dictionary core for StudyMate"

[dependencies]
anyhow = "1.0"
encoding_rs = "0.8"
flate2 = "1.1"
lzo = "0.1"
ripemd = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
